name: Build & Publish Native Release Binaries

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Target platform to build"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - android
          - windows
      release_tag:
        description: "Release tag (e.g. v1.0.6; defaults to v1.0.6 if omitted)"
        required: false
        default: "v1.0.6"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-desktop-windows:
    name: Build Windows Desktop NSIS Installer
    if: github.event_name == 'push' || github.event.inputs.target == 'all' || github.event.inputs.target == 'windows' || github.event.inputs.target == null
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./apps/desktop/src-tauri -> target"

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Web Application
        run: pnpm --filter @campusmesh/web build

      - name: Force Clean Desktop Binary Cache
        shell: pwsh
        run: |
          cd apps/desktop/src-tauri
          cargo clean -p campusmesh-desktop

      - name: Build Tauri Desktop Package
        run: pnpm --filter @campusmesh/desktop build

      - name: Verify Output Executables
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if (-not $tag -or $tag -eq "main") {
            $tag = "${{ github.event.inputs.release_tag }}"
          }
          if (-not $tag) { $tag = "v1.0.6" }
          $ver = $tag.TrimStart("v")

          Get-ChildItem -Recurse apps/desktop/src-tauri/target/release/bundle
          if (Test-Path apps/desktop/src-tauri/target/release/campusmesh-desktop.exe) {
            Copy-Item apps/desktop/src-tauri/target/release/campusmesh-desktop.exe "apps/desktop/src-tauri/target/release/bundle/nsis/CampusMesh_${ver}_portable.exe" -Force
            Copy-Item apps/desktop/src-tauri/target/release/campusmesh-desktop.exe "apps/desktop/src-tauri/target/release/bundle/nsis/CampusMesh-portable.exe" -Force
            if (Test-Path apps/desktop/src-tauri/swarm-runtime) {
              $zipStage = "apps/desktop/src-tauri/target/release/portable-stage"
              Remove-Item $zipStage -Recurse -Force -ErrorAction SilentlyContinue
              New-Item -ItemType Directory -Force -Path $zipStage | Out-Null
              Copy-Item apps/desktop/src-tauri/target/release/campusmesh-desktop.exe "$zipStage\CampusMesh-portable.exe" -Force
              Copy-Item apps/desktop/src-tauri/swarm-runtime "$zipStage\swarm-runtime" -Recurse -Force
              Compress-Archive -Path "$zipStage\*" -DestinationPath "apps/desktop/src-tauri/target/release/bundle/nsis/CampusMesh-portable-swarm.zip" -Force
            }
          }
          $setupExe = Get-ChildItem "apps/desktop/src-tauri/target/release/bundle/nsis/*setup.exe" | Select-Object -First 1
          if ($setupExe) {
            Copy-Item $setupExe.FullName "apps/desktop/src-tauri/target/release/bundle/nsis/CampusMesh-setup.exe" -Force
          }

      - name: Upload Windows Binaries to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_name != 'main' && github.ref_name || (github.event.inputs.release_tag != '' && github.event.inputs.release_tag || 'v1.0.6') }}
          files: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/nsis/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows Artifact to Workflow
        uses: actions/upload-artifact@v4
        with:
          name: CampusMesh-Windows-x64-Setup
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/nsis/*.zip

  build-mobile-android:
    name: Build Android APK
    if: github.event_name == 'push' || github.event.inputs.target == 'all' || github.event.inputs.target == 'android' || github.event.inputs.target == null
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Web Application
        run: pnpm --filter @campusmesh/web build

      - name: Sync Capacitor Android
        run: pnpm --filter @campusmesh/mobile sync

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission for Gradlew
        run: chmod +x apps/mobile/android/gradlew

      - name: Build Android Release APK
        run: |
          cd apps/mobile/android
          ./gradlew assembleRelease

      - name: Prepare Release APK Artifact
        run: |
          TAG="${{ github.ref_name }}"
          if [ -z "$TAG" ] || [ "$TAG" = "main" ]; then
            TAG="${{ github.event.inputs.release_tag }}"
          fi
          if [ -z "$TAG" ]; then TAG="v1.0.6"; fi
          VER="${TAG#v}"

          mkdir -p artifacts
          APK_SRC=$(find apps/mobile/android/app/build/outputs/ -name "*.apk" | head -n 1)
          if [ -n "$APK_SRC" ]; then
            cp "$APK_SRC" "artifacts/CampusMesh_${VER}.apk"
            cp "$APK_SRC" "artifacts/CampusMesh.apk"
          fi
          ls -la artifacts/

      - name: Upload Android APK to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_name != 'main' && github.ref_name || (github.event.inputs.release_tag != '' && github.event.inputs.release_tag || 'v1.0.6') }}
          files: artifacts/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Android Artifact to Workflow
        uses: actions/upload-artifact@v4
        with:
          name: CampusMesh-Android-APK
          path: artifacts/*.apk
