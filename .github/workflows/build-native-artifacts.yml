name: Build & Publish Native Release Binaries

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-desktop-windows:
    name: Build Windows Desktop NSIS Installer
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './apps/desktop/src-tauri -> target'

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Web Application
        run: pnpm --filter @campusmesh/web build

      - name: Build Tauri Desktop Package
        run: pnpm --filter @campusmesh/desktop build

      - name: Verify Output Executables
        shell: pwsh
        run: |
          Get-ChildItem -Recurse apps/desktop/src-tauri/target/release/bundle
          if (Test-Path apps/desktop/src-tauri/target/release/campusmesh-desktop.exe) {
            Copy-Item apps/desktop/src-tauri/target/release/campusmesh-desktop.exe apps/desktop/src-tauri/target/release/bundle/nsis/CampusMesh_1.0.0_portable.exe -Force
          }

      - name: Upload Windows NSIS Installer to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: v1.0.0
          files: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows Artifact to Workflow
        uses: actions/upload-artifact@v4
        with:
          name: CampusMesh-Windows-x64-Setup
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
