name: Build & Publish Native Release Binaries

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Target platform to build"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - android
          - windows
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-desktop-windows:
    name: Build Windows Desktop NSIS Installer
    if: github.event_name == 'push' || github.event.inputs.target == 'all' || github.event.inputs.target == 'windows' || github.event.inputs.target == null
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./apps/desktop/src-tauri -> target"

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Web Application
        run: pnpm --filter @campusmesh/web build

      - name: Build Tauri Desktop Package
        run: pnpm --filter @campusmesh/desktop build

      - name: Verify Output Executables
        shell: pwsh
        run: |
          Get-ChildItem -Recurse apps/desktop/src-tauri/target/release/bundle
          if (Test-Path apps/desktop/src-tauri/target/release/campusmesh-desktop.exe) {
            Copy-Item apps/desktop/src-tauri/target/release/campusmesh-desktop.exe apps/desktop/src-tauri/target/release/bundle/nsis/CampusMesh_1.0.0_portable.exe -Force
          }

      - name: Upload Windows Binaries to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: v1.0.0
          files: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows Artifact to Workflow
        uses: actions/upload-artifact@v4
        with:
          name: CampusMesh-Windows-x64-Setup
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe

  build-mobile-android:
    name: Build Android APK
    if: github.event_name == 'push' || github.event.inputs.target == 'all' || github.event.inputs.target == 'android' || github.event.inputs.target == null
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Web Application
        run: pnpm --filter @campusmesh/web build

      - name: Sync Capacitor Android
        run: pnpm --filter @campusmesh/mobile sync

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission for Gradlew
        run: chmod +x apps/mobile/android/gradlew

      - name: Build Android Release APK
        run: |
          cd apps/mobile/android
          ./gradlew assembleRelease

      - name: Prepare Release APK Artifact
        run: |
          mkdir -p artifacts
          if [ -f "apps/mobile/android/app/build/outputs/apk/release/app-release.apk" ]; then
            cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk artifacts/CampusMesh_1.0.0.apk
          elif [ -f "apps/mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
            cp apps/mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk artifacts/CampusMesh_1.0.0.apk
          else
            find apps/mobile/android/app/build/outputs/ -name "*.apk" -exec cp {} artifacts/CampusMesh_1.0.0.apk \;
          fi
          ls -la artifacts/

      - name: Upload Android APK to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: v1.0.0
          files: artifacts/CampusMesh_1.0.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Android Artifact to Workflow
        uses: actions/upload-artifact@v4
        with:
          name: CampusMesh-Android-APK
          path: artifacts/CampusMesh_1.0.0.apk
